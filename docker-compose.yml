services:
  web:
    image: ${IMAGE:-ghcr.io/ariasbenraq/atm-wo-manager}:${TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${HTTP_PORT:-80}:80"
    mem_limit: 512m
    cpus: "1.0"
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
