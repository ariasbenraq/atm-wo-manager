name: Deploy

# Every merge to main: CI -> build and push the image -> deploy to the server
# over Tailscale + SSH. Manual runs (workflow_dispatch) are accepted, but only
# main is allowed to reach production.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits instead of cancelling a running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/ariasbenraq
  DEPLOY_DIR: /opt/atm

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Only the SHA tag until the cut-over is done: the old stack (Caddy ->
          # web:80) still runs ghcr.io/ariasbenraq/atm-wo-manager:latest, and this
          # image listens on 8080. Add the ":latest" line back after deleting
          # the old "atm-tool-manager" stack.
          tags: |
            ${{ env.REGISTRY }}/atm-wo-manager:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      # The runner joins the tailnet as an ephemeral node tagged tag:ci, which
      # the ACL allows to reach only port 22 of the server.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy stack and deploy script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            deploy/docker-stack.yml deploy/deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash $DEPLOY_DIR/deploy.sh $GITHUB_SHA"
